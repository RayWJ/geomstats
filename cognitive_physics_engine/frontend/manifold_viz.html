<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raywu v11.0 - Manifold Visualization</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Monaco', 'Courier New', monospace;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
            color: #00ff88;
            overflow: hidden;
        }
        
        #container {
            display: flex;
            height: 100vh;
        }
        
        #canvas-container {
            flex: 1;
            position: relative;
        }
        
        #sidebar {
            width: 350px;
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            overflow-y: auto;
            border-left: 2px solid #00ff88;
        }
        
        h1 {
            font-size: 20px;
            margin-bottom: 10px;
            color: #00ff88;
            text-shadow: 0 0 10px #00ff88;
        }
        
        h2 {
            font-size: 16px;
            margin-top: 20px;
            margin-bottom: 10px;
            color: #00ffff;
        }
        
        .stat {
            display: flex;
            justify-content: space-between;
            margin: 5px 0;
            font-size: 12px;
        }
        
        .stat-label {
            color: #aaa;
        }
        
        .stat-value {
            color: #00ff88;
            font-weight: bold;
        }
        
        .agent-card {
            background: rgba(0, 255, 136, 0.1);
            border: 1px solid #00ff88;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
        }
        
        .agent-id {
            font-weight: bold;
            color: #00ffff;
        }
        
        .button {
            background: #00ff88;
            color: #000;
            border: none;
            padding: 10px 15px;
            margin: 5px;
            cursor: pointer;
            font-family: inherit;
            font-size: 12px;
            border-radius: 3px;
            transition: all 0.3s;
        }
        
        .button:hover {
            background: #00ffff;
            transform: scale(1.05);
        }
        
        #controls {
            margin: 20px 0;
        }
        
        .toggle {
            display: flex;
            align-items: center;
            margin: 10px 0;
        }
        
        .toggle input {
            margin-right: 10px;
        }
        
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px;
            color: #00ff88;
            text-shadow: 0 0 20px #00ff88;
            z-index: 1000;
        }
        
        .hidden {
            display: none;
        }
        
        #view-selector {
            display: flex;
            gap: 10px;
            margin: 10px 0;
        }
        
        .view-btn {
            flex: 1;
            background: rgba(0, 255, 136, 0.2);
            color: #00ff88;
            border: 1px solid #00ff88;
            padding: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .view-btn.active {
            background: #00ff88;
            color: #000;
        }
        
        .heatmap-legend {
            margin: 10px 0;
            padding: 10px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 5px;
        }
        
        .legend-gradient {
            height: 20px;
            background: linear-gradient(to right, #0000ff, #00ffff, #00ff00, #ffff00, #ff0000);
            border-radius: 3px;
        }
        
        .legend-labels {
            display: flex;
            justify-content: space-between;
            margin-top: 5px;
            font-size: 10px;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="canvas-container">
            <div id="loading">Loading Manifold...</div>
            <canvas id="canvas"></canvas>
        </div>
        
        <div id="sidebar">
            <h1>🎯 RAYWU v11.0</h1>
            <p style="font-size: 10px; color: #666;">Manifold Visualization</p>
            
            <div id="view-selector">
                <button class="view-btn active" data-view="poincare">Poincaré Disk</button>
                <button class="view-btn" data-view="sphere">Sphere</button>
                <button class="view-btn" data-view="combined">Combined</button>
            </div>
            
            <h2>📊 Statistics</h2>
            <div class="stat">
                <span class="stat-label">Manifold Type:</span>
                <span class="stat-value">H²×S²×R⁴</span>
            </div>
            <div class="stat">
                <span class="stat-label">Agents:</span>
                <span class="stat-value" id="agent-count">0</span>
            </div>
            <div class="stat">
                <span class="stat-label">Geodesics:</span>
                <span class="stat-value" id="geodesic-count">0</span>
            </div>
            <div class="stat">
                <span class="stat-label">Avg Distance:</span>
                <span class="stat-value" id="avg-distance">0.000</span>
            </div>
            
            <h2>🎮 Controls</h2>
            <div id="controls">
                <div class="toggle">
                    <input type="checkbox" id="show-grid" checked>
                    <label for="show-grid">Show Grid</label>
                </div>
                <div class="toggle">
                    <input type="checkbox" id="show-geodesics" checked>
                    <label for="show-geodesics">Show Geodesics</label>
                </div>
                <div class="toggle">
                    <input type="checkbox" id="show-heatmap">
                    <label for="show-heatmap">Show Metric Heatmap</label>
                </div>
                <div class="toggle">
                    <input type="checkbox" id="auto-rotate">
                    <label for="auto-rotate">Auto Rotate</label>
                </div>
                <button class="button" id="reset-view">Reset View</button>
                <button class="button" id="refresh-data">Refresh Data</button>
            </div>
            
            <div id="heatmap-legend" class="heatmap-legend hidden">
                <h2>Metric Det(g)</h2>
                <div class="legend-gradient"></div>
                <div class="legend-labels">
                    <span id="legend-min">10^0</span>
                    <span>10^6</span>
                    <span id="legend-max">10^12</span>
                </div>
            </div>
            
            <h2>🤖 Agents</h2>
            <div id="agent-list"></div>
        </div>
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // ==================== GLOBAL STATE ====================
        
        let scene, camera, renderer, controls;
        let poincareGroup, sphereGroup, geodesicGroup, heatmapGroup;
        let vizData = null;
        let currentView = 'poincare';
        let autoRotate = false;
        
        // ==================== INITIALIZATION ====================
        
        function init() {
            // Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a0a);
            
            // Camera
            const container = document.getElementById('canvas-container');
            const width = container.clientWidth;
            const height = container.clientHeight;
            camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
            camera.position.set(0, 0, 3);
            
            // Renderer
            renderer = new THREE.WebGLRenderer({
                canvas: document.getElementById('canvas'),
                antialias: true
            });
            renderer.setSize(width, height);
            
            // Groups
            poincareGroup = new THREE.Group();
            sphereGroup = new THREE.Group();
            geodesicGroup = new THREE.Group();
            heatmapGroup = new THREE.Group();
            
            scene.add(poincareGroup);
            scene.add(sphereGroup);
            scene.add(geodesicGroup);
            scene.add(heatmapGroup);
            
            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);
            
            const pointLight = new THREE.PointLight(0x00ff88, 0.8);
            pointLight.position.set(5, 5, 5);
            scene.add(pointLight);
            
            // Event listeners
            window.addEventListener('resize', onWindowResize);
            document.getElementById('show-grid').addEventListener('change', updateVisibility);
            document.getElementById('show-geodesics').addEventListener('change', updateVisibility);
            document.getElementById('show-heatmap').addEventListener('change', updateVisibility);
            document.getElementById('auto-rotate').addEventListener('change', (e) => {
                autoRotate = e.target.checked;
            });
            document.getElementById('reset-view').addEventListener('click', resetView);
            document.getElementById('refresh-data').addEventListener('click', loadData);
            
            // View selector
            document.querySelectorAll('.view-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    currentView = e.target.dataset.view;
                    updateView();
                });
            });
            
            // Mouse controls
            let isDragging = false;
            let previousMousePosition = { x: 0, y: 0 };
            
            renderer.domElement.addEventListener('mousedown', () => isDragging = true);
            renderer.domElement.addEventListener('mouseup', () => isDragging = false);
            renderer.domElement.addEventListener('mousemove', (e) => {
                if (isDragging) {
                    const deltaX = e.clientX - previousMousePosition.x;
                    const deltaY = e.clientY - previousMousePosition.y;
                    
                    poincareGroup.rotation.y += deltaX * 0.01;
                    poincareGroup.rotation.x += deltaY * 0.01;
                    
                    sphereGroup.rotation.y += deltaX * 0.01;
                    sphereGroup.rotation.x += deltaY * 0.01;
                }
                
                previousMousePosition = { x: e.clientX, y: e.clientY };
            });
            
            // Wheel zoom
            renderer.domElement.addEventListener('wheel', (e) => {
                e.preventDefault();
                camera.position.z += e.deltaY * 0.01;
                camera.position.z = Math.max(1, Math.min(10, camera.position.z));
            });
            
            // Load data
            loadData();
            
            // Animation loop
            animate();
        }
        
        // ==================== DATA LOADING ====================
        
        async function loadData() {
            try {
                document.getElementById('loading').classList.remove('hidden');
                
                // Try to load from backend
                const response = await fetch('/visualization_data.json');
                
                if (response.ok) {
                    vizData = await response.json();
                } else {
                    // Generate mock data
                    vizData = generateMockData();
                }
                
                renderVisualization();
                updateSidebar();
                
                document.getElementById('loading').classList.add('hidden');
                
            } catch (error) {
                console.error('Error loading data:', error);
                vizData = generateMockData();
                renderVisualization();
                updateSidebar();
                document.getElementById('loading').classList.add('hidden');
            }
        }
        
        function generateMockData() {
            return {
                poincare_grid: {
                    circles: Array(8).fill(0).map((_, i) => {
                        const r = (i + 1) / 9;
                        return Array(100).fill(0).map((_, j) => {
                            const theta = 2 * Math.PI * j / 100;
                            return [r * Math.cos(theta), r * Math.sin(theta)];
                        });
                    }),
                    rays: []
                },
                agents: {
                    poincare: [
                        { point: [0.2, 0.3], agent_id: 'agent_0', level: 1, color: '#FF6B6B' },
                        { point: [-0.4, 0.1], agent_id: 'agent_1', level: 3, color: '#4ECDC4' },
                        { point: [0.1, -0.5], agent_id: 'agent_2', level: 5, color: '#95E1D3' }
                    ],
                    agents: [
                        { id: 'agent_0', level: 1, domain: 'tech', stance: 'bull', confidence: 0.8 },
                        { id: 'agent_1', level: 3, domain: 'finance', stance: 'bear', confidence: 0.6 },
                        { id: 'agent_2', level: 5, domain: 'politics', stance: 'neutral', confidence: 0.5 }
                    ]
                },
                geodesics: [
                    {
                        points_poincare: [[0.2, 0.3], [0.0, 0.2], [-0.2, 0.1], [-0.4, 0.1]],
                        distance: 0.8,
                        color: '#FFD700'
                    }
                ]
            };
        }
        
        // ==================== VISUALIZATION RENDERING ====================
        
        function renderVisualization() {
            // Clear previous
            poincareGroup.clear();
            sphereGroup.clear();
            geodesicGroup.clear();
            heatmapGroup.clear();
            
            // Render Poincaré disk
            renderPoincareGrid();
            renderPoincareAgents();
            
            // Render geodesics
            renderGeodesics();
            
            updateView();
        }
        
        function renderPoincareGrid() {
            if (!vizData.poincare_grid) return;
            
            const gridMaterial = new THREE.LineBasicMaterial({ color: 0x00ff88, opacity: 0.3, transparent: true });
            
            // Circles
            vizData.poincare_grid.circles.forEach(circle => {
                const points = circle.map(([x, y]) => new THREE.Vector3(x, y, 0));
                const geometry = new THREE.BufferGeometry().setFromPoints(points);
                const line = new THREE.Line(geometry, gridMaterial);
                poincareGroup.add(line);
            });
            
            // Boundary circle
            const boundaryPoints = [];
            for (let i = 0; i <= 100; i++) {
                const theta = 2 * Math.PI * i / 100;
                boundaryPoints.push(new THREE.Vector3(Math.cos(theta), Math.sin(theta), 0));
            }
            const boundaryGeometry = new THREE.BufferGeometry().setFromPoints(boundaryPoints);
            const boundaryLine = new THREE.Line(boundaryGeometry, new THREE.LineBasicMaterial({ color: 0x00ffff, linewidth: 2 }));
            poincareGroup.add(boundaryLine);
        }
        
        function renderPoincareAgents() {
            if (!vizData.agents.poincare) return;
            
            vizData.agents.poincare.forEach(agent => {
                const [x, y] = agent.point;
                
                // Agent sphere
                const geometry = new THREE.SphereGeometry(0.05, 16, 16);
                const material = new THREE.MeshStandardMaterial({ 
                    color: agent.color, 
                    emissive: agent.color, 
                    emissiveIntensity: 0.5 
                });
                const sphere = new THREE.Mesh(geometry, material);
                sphere.position.set(x, y, 0);
                poincareGroup.add(sphere);
                
                // Label
                // (In production, use THREE.CSS2DRenderer for labels)
            });
        }
        
        function renderGeodesics() {
            if (!vizData.geodesics) return;
            
            vizData.geodesics.forEach(geodesic => {
                const points = geodesic.points_poincare.map(([x, y]) => new THREE.Vector3(x, y, 0));
                const geometry = new THREE.BufferGeometry().setFromPoints(points);
                const material = new THREE.LineBasicMaterial({ color: geodesic.color, linewidth: 2 });
                const line = new THREE.Line(geometry, material);
                geodesicGroup.add(line);
            });
        }
        
        // ==================== VIEW MANAGEMENT ====================
        
        function updateView() {
            poincareGroup.visible = (currentView === 'poincare' || currentView === 'combined');
            sphereGroup.visible = (currentView === 'sphere' || currentView === 'combined');
            
            if (currentView === 'combined') {
                poincareGroup.position.set(-1.5, 0, 0);
                sphereGroup.position.set(1.5, 0, 0);
            } else {
                poincareGroup.position.set(0, 0, 0);
                sphereGroup.position.set(0, 0, 0);
            }
        }
        
        function updateVisibility() {
            const showGrid = document.getElementById('show-grid').checked;
            const showGeodesics = document.getElementById('show-geodesics').checked;
            const showHeatmap = document.getElementById('show-heatmap').checked;
            
            poincareGroup.children.forEach(child => {
                if (child.type === 'Line') child.visible = showGrid;
            });
            
            geodesicGroup.visible = showGeodesics;
            heatmapGroup.visible = showHeatmap;
            
            document.getElementById('heatmap-legend').classList.toggle('hidden', !showHeatmap);
        }
        
        function resetView() {
            camera.position.set(0, 0, 3);
            poincareGroup.rotation.set(0, 0, 0);
            sphereGroup.rotation.set(0, 0, 0);
        }
        
        // ==================== SIDEBAR ====================
        
        function updateSidebar() {
            if (!vizData) return;
            
            document.getElementById('agent-count').textContent = vizData.agents.agents.length;
            document.getElementById('geodesic-count').textContent = vizData.geodesics.length;
            
            // Average distance
            const avgDist = vizData.geodesics.length > 0
                ? vizData.geodesics.reduce((sum, g) => sum + g.distance, 0) / vizData.geodesics.length
                : 0;
            document.getElementById('avg-distance').textContent = avgDist.toFixed(3);
            
            // Agent list
            const agentList = document.getElementById('agent-list');
            agentList.innerHTML = '';
            
            vizData.agents.agents.forEach(agent => {
                const card = document.createElement('div');
                card.className = 'agent-card';
                card.innerHTML = `
                    <div class="agent-id">${agent.id}</div>
                    <div class="stat">
                        <span class="stat-label">Level:</span>
                        <span class="stat-value">L${agent.level}</span>
                    </div>
                    <div class="stat">
                        <span class="stat-label">Domain:</span>
                        <span class="stat-value">${agent.domain}</span>
                    </div>
                    <div class="stat">
                        <span class="stat-label">Stance:</span>
                        <span class="stat-value">${agent.stance}</span>
                    </div>
                    <div class="stat">
                        <span class="stat-label">Confidence:</span>
                        <span class="stat-value">${(agent.confidence * 100).toFixed(0)}%</span>
                    </div>
                `;
                agentList.appendChild(card);
            });
        }
        
        // ==================== ANIMATION ====================
        
        function animate() {
            requestAnimationFrame(animate);
            
            if (autoRotate) {
                poincareGroup.rotation.y += 0.005;
                sphereGroup.rotation.y += 0.005;
            }
            
            renderer.render(scene, camera);
        }
        
        function onWindowResize() {
            const container = document.getElementById('canvas-container');
            const width = container.clientWidth;
            const height = container.clientHeight;
            
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            
            renderer.setSize(width, height);
        }
        
        // ==================== START ====================
        
        init();
    </script>
</body>
</html>
