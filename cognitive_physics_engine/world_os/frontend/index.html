<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WorldOS v61.0 - Cognitive Physics Engine</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 1.1em;
        }

        .status-bar {
            background: rgba(255, 255, 255, 0.95);
            padding: 15px 20px;
            border-radius: 10px;
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        .status-item {
            text-align: center;
        }

        .status-label {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 5px;
        }

        .status-value {
            font-size: 1.5em;
            font-weight: bold;
            color: #667eea;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        }

        .card h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.5em;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card h2::before {
            content: '●';
            color: #667eea;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: 500;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .entity-list {
            max-height: 400px;
            overflow-y: auto;
        }

        .entity-item {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .entity-item:hover {
            background: #e9ecef;
            transform: translateX(5px);
        }

        .entity-item.active {
            background: #667eea;
            color: white;
        }

        .entity-item h3 {
            margin-bottom: 5px;
        }

        .entity-item p {
            font-size: 0.9em;
            opacity: 0.8;
        }

        .log {
            background: #1e1e1e;
            color: #00ff00;
            font-family: 'Courier New', monospace;
            padding: 15px;
            border-radius: 8px;
            max-height: 300px;
            overflow-y: auto;
            font-size: 0.9em;
        }

        .log-entry {
            margin-bottom: 5px;
        }

        .log-entry.success {
            color: #00ff00;
        }

        .log-entry.error {
            color: #ff0000;
        }

        .log-entry.info {
            color: #00bfff;
        }

        .badge {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 0.85em;
            font-weight: 600;
            margin-right: 5px;
        }

        .badge-l1 { background: #ffc107; color: #000; }
        .badge-l2 { background: #17a2b8; color: #fff; }
        .badge-l3 { background: #28a745; color: #fff; }
        .badge-l4 { background: #fd7e14; color: #fff; }
        .badge-l5 { background: #dc3545; color: #fff; }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>🌍 WorldOS v61.0</h1>
            <p>Cognitive Physics Engine - Riemannian Manifold Simulation</p>
        </div>

        <!-- Status Bar -->
        <div class="status-bar">
            <div class="status-item">
                <div class="status-label">Total Entities</div>
                <div class="status-value" id="totalEntities">0</div>
            </div>
            <div class="status-item">
                <div class="status-label">Total Ticks</div>
                <div class="status-value" id="totalTicks">0</div>
            </div>
            <div class="status-item">
                <div class="status-label">LLM Status</div>
                <div class="status-value" id="llmStatus">Loading...</div>
            </div>
            <div class="status-item">
                <div class="status-label">API Status</div>
                <div class="status-value" id="apiStatus">🔴</div>
            </div>
        </div>

        <!-- Main Grid -->
        <div class="grid">
            <!-- Create Entity -->
            <div class="card">
                <h2>Create Entity</h2>
                <form id="createEntityForm">
                    <div class="form-group">
                        <label>Entity ID</label>
                        <input type="text" id="entityId" placeholder="e.g., nvidia" required>
                    </div>
                    <div class="form-group">
                        <label>Level (1-5)</label>
                        <select id="entityLevel">
                            <option value="1">L1 - Facts</option>
                            <option value="2">L2 - Tactics</option>
                            <option value="3" selected>L3 - Logic</option>
                            <option value="4">L4 - Operations</option>
                            <option value="5">L5 - Strategy</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Domain</label>
                        <select id="entityDomain">
                            <option value="tech">Technology</option>
                            <option value="finance">Finance</option>
                            <option value="politics">Politics</option>
                            <option value="science">Science</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Stance (-1 to 1)</label>
                        <input type="number" id="entityStance" value="0.5" min="-1" max="1" step="0.1">
                    </div>
                    <div class="form-group">
                        <label>Intent (-1 to 1)</label>
                        <input type="number" id="entityIntent" value="0.5" min="-1" max="1" step="0.1">
                    </div>
                    <button type="submit" class="btn">Create Entity</button>
                </form>
            </div>

            <!-- Entity List -->
            <div class="card">
                <h2>Entities</h2>
                <div class="entity-list" id="entityList">
                    <p style="text-align: center; color: #999;">No entities yet. Create one!</p>
                </div>
                <button class="btn btn-secondary" onclick="refreshEntities()" style="margin-top: 15px;">
                    Refresh List
                </button>
            </div>

            <!-- Simulation Control -->
            <div class="card">
                <h2>Simulation Control</h2>
                <div class="form-group">
                    <label>Selected Entity</label>
                    <input type="text" id="selectedEntity" placeholder="Select from list" readonly>
                </div>
                <div class="form-group">
                    <label>
                        <input type="checkbox" id="useLLM" checked>
                        Use LLM Analysis
                    </label>
                </div>
                <button class="btn" onclick="runTick()">
                    Execute Single Tick
                </button>
                <div style="height: 15px;"></div>
                <div class="form-group">
                    <label>Episode Length (ticks)</label>
                    <input type="number" id="episodeLength" value="5" min="1" max="20">
                </div>
                <button class="btn btn-secondary" onclick="runEpisode()">
                    Run Episode
                </button>
                <div class="loading" id="loading">
                    <div class="spinner"></div>
                    <p style="margin-top: 10px;">Simulating...</p>
                </div>
            </div>
        </div>

        <!-- Activity Log -->
        <div class="card">
            <h2>Activity Log</h2>
            <div class="log" id="activityLog">
                <div class="log-entry info">[INIT] WorldOS v61.0 Frontend Ready</div>
            </div>
        </div>
    </div>

    <script>
        // API base URL - use relative path for same-origin requests
        const API_BASE = window.location.origin;
        let selectedEntityId = null;

        // Initialize
        async function init() {
            await checkHealth();
            await refreshEntities();
            await refreshStats();
            setInterval(refreshStats, 5000);
        }

        // Check API health
        async function checkHealth() {
            try {
                const res = await fetch(`${API_BASE}/api/health`);
                const data = await res.json();
                
                document.getElementById('apiStatus').textContent = '🟢';
                document.getElementById('llmStatus').textContent = data.llm_available ? '🤖' : '🔴';
                
                log('API health check passed', 'success');
            } catch (err) {
                document.getElementById('apiStatus').textContent = '🔴';
                log(`API error: ${err.message}`, 'error');
            }
        }

        // Refresh statistics
        async function refreshStats() {
            try {
                const res = await fetch(`${API_BASE}/api/world/stats`);
                const data = await res.json();
                
                document.getElementById('totalEntities').textContent = data.total_entities;
                document.getElementById('totalTicks').textContent = data.tick_count;
            } catch (err) {
                console.error('Stats refresh failed:', err);
            }
        }

        // Refresh entity list
        async function refreshEntities() {
            try {
                const res = await fetch(`${API_BASE}/api/entity/list`);
                const data = await res.json();
                
                const listEl = document.getElementById('entityList');
                
                if (data.count === 0) {
                    listEl.innerHTML = '<p style="text-align: center; color: #999;">No entities yet. Create one!</p>';
                    return;
                }
                
                listEl.innerHTML = data.entities.map(e => `
                    <div class="entity-item ${e.id === selectedEntityId ? 'active' : ''}" 
                         onclick="selectEntity('${e.id}')">
                        <h3>
                            <span class="badge badge-${e.level.toLowerCase()}">${e.level}</span>
                            ${e.id}
                        </h3>
                        <p>${e.domain} | Stance: ${e.stance?.toFixed(2) || 'N/A'}</p>
                    </div>
                `).join('');
                
                log(`Loaded ${data.count} entities`, 'info');
            } catch (err) {
                log(`Failed to load entities: ${err.message}`, 'error');
            }
        }

        // Select entity
        function selectEntity(id) {
            selectedEntityId = id;
            document.getElementById('selectedEntity').value = id;
            refreshEntities();
            log(`Selected entity: ${id}`, 'info');
        }

        // Create entity
        document.getElementById('createEntityForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const entityData = {
                entity_id: document.getElementById('entityId').value,
                metadata: {
                    level: parseInt(document.getElementById('entityLevel').value),
                    domain: document.getElementById('entityDomain').value,
                    stance: parseFloat(document.getElementById('entityStance').value),
                    intent: parseFloat(document.getElementById('entityIntent').value),
                    time: 0.0,
                    scale: 0.0
                },
                description: `🎯 Entity: ${document.getElementById('entityId').value}\n\nCreated via frontend.`
            };
            
            try {
                const res = await fetch(`${API_BASE}/api/entity/create`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(entityData)
                });
                
                if (!res.ok) throw new Error(await res.text());
                
                const data = await res.json();
                log(`✅ Created entity: ${data.entity_id}`, 'success');
                
                await refreshEntities();
                await refreshStats();
                
                // Reset form
                e.target.reset();
            } catch (err) {
                log(`❌ Failed to create entity: ${err.message}`, 'error');
            }
        });

        // Run single tick
        async function runTick() {
            if (!selectedEntityId) {
                log('⚠️ Please select an entity first', 'error');
                return;
            }
            
            document.getElementById('loading').classList.add('active');
            
            try {
                const useLLM = document.getElementById('useLLM').checked;
                
                const res = await fetch(`${API_BASE}/api/entity/${selectedEntityId}/tick`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ llm_intervention: useLLM })
                });
                
                if (!res.ok) throw new Error(await res.text());
                
                const data = await res.json();
                
                log(`🎯 Tick #${data.tick} completed`, 'success');
                log(`   Distance: ${data.distance.toFixed(4)}`, 'info');
                log(`   Level: ${data.decoded.level}`, 'info');
                
                if (data.intervention) {
                    log(`   ⚠️ Intervention: ${data.llm_decision}`, 'info');
                }
                
                await refreshStats();
            } catch (err) {
                log(`❌ Tick failed: ${err.message}`, 'error');
            } finally {
                document.getElementById('loading').classList.remove('active');
            }
        }

        // Run episode
        async function runEpisode() {
            if (!selectedEntityId) {
                log('⚠️ Please select an entity first', 'error');
                return;
            }
            
            document.getElementById('loading').classList.add('active');
            
            try {
                const numTicks = parseInt(document.getElementById('episodeLength').value);
                
                const res = await fetch(`${API_BASE}/api/entity/${selectedEntityId}/episode`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        num_ticks: numTicks,
                        llm_frequency: 2
                    })
                });
                
                if (!res.ok) throw new Error(await res.text());
                
                const data = await res.json();
                
                log(`🎬 Episode completed!`, 'success');
                log(`   Total ticks: ${data.total_ticks}`, 'info');
                log(`   Total distance: ${data.total_distance.toFixed(4)}`, 'info');
                log(`   Interventions: ${data.interventions}`, 'info');
                
                await refreshStats();
            } catch (err) {
                log(`❌ Episode failed: ${err.message}`, 'error');
            } finally {
                document.getElementById('loading').classList.remove('active');
            }
        }

        // Log message
        function log(message, type = 'info') {
            const logEl = document.getElementById('activityLog');
            const timestamp = new Date().toLocaleTimeString();
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.textContent = `[${timestamp}] ${message}`;
            logEl.appendChild(entry);
            logEl.scrollTop = logEl.scrollHeight;
        }

        // Start
        init();
    </script>
</body>
</html>
